# Bodegas del Atuel - Trabajo Práctico Integrador
# PostgreSQL 16 (el TP pide 14+)
#
# Los .sql de db/migrations se ejecutan en orden alfabético (001_, 002_, ...)
# SOLO la primera vez que se crea el volumen. Para re-ejecutarlos desde cero:
#   docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16
    container_name: bodegas_atuel_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Mendoza
      # Claves de los roles bodegas_api y bodegas_ro (las aplica 090_roles_passwords.sh)
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
      RO_DB_PASSWORD: ${RO_DB_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - bodegas_atuel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # API REST (FastAPI + psycopg, sin ORM). Se conecta como bodegas_api (privilegios minimos).
  # Docs interactivas: http://localhost:8000/docs
  api:
    build: ./api
    container_name: bodegas_atuel_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: bodegas_api
      DB_PASSWORD: ${API_DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  bodegas_atuel_pgdata:
