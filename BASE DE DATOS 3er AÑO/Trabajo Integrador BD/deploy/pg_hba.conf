# Autenticacion de PostgreSQL en produccion.
# - Socket local (solo `docker compose exec` del administrador): confianza.
# - Red: SOLO TLS (hostssl) y SOLO los roles de la aplicacion, con SCRAM-SHA-256.
#   El propietario (bodegas_owner) no puede conectarse por red.
# - Todo lo demas (conexion sin TLS, otros usuarios) se rechaza.
local   all   all                         trust
hostssl all   bodegas_api   0.0.0.0/0     scram-sha-256
hostssl all   bodegas_ro    0.0.0.0/0     scram-sha-256
host    all   all           0.0.0.0/0     reject
host    all   all           ::/0          reject
